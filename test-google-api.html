<!DOCTYPE html>
<html>
<head>
    <title>Google API Key Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        #map {
            height: 400px;
            width: 100%;
            margin: 20px 0;
            border: 1px solid #ccc;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <h1>Google Maps API Key Test</h1>
    <p>API Key: <code>AIzaSyB9sHvox4UZJFvSw4EiD0olspvRwHPD8GQ</code></p>

    <div id="status"></div>

    <h2>Karte (Maps JavaScript API)</h2>
    <div id="map"></div>

    <h2>Places API Test</h2>
    <div id="places-status"></div>

    <script>
        const API_KEY = 'AIzaSyB9sHvox4UZJFvSw4EiD0olspvRwHPD8GQ';
        const statusDiv = document.getElementById('status');
        const placesStatusDiv = document.getElementById('places-status');

        // Load Google Maps API
        function loadGoogleMaps() {
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places,visualization&callback=initMap`;
            script.async = true;
            script.defer = true;
            script.onerror = function() {
                statusDiv.innerHTML = '<div class="status error">❌ Fehler beim Laden der Google Maps API. Bitte überprüfen Sie:<br>1. Ist der API Key korrekt?<br>2. Ist die "Maps JavaScript API" aktiviert?<br>3. Sind die API-Beschränkungen korrekt konfiguriert?</div>';
            };
            document.head.appendChild(script);
        }

        // Initialize map
        window.initMap = function() {
            try {
                const map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: 48.2082, lng: 16.3738 }, // Wien
                    zoom: 12
                });

                // Add a marker
                new google.maps.Marker({
                    position: { lat: 48.2082, lng: 16.3738 },
                    map: map,
                    title: 'Wien'
                });

                statusDiv.innerHTML = '<div class="status success">✅ Maps JavaScript API funktioniert!</div>';

                // Test Places API
                testPlacesAPI(map);
            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">❌ Fehler beim Initialisieren der Karte: ${error.message}</div>`;
            }
        }

        // Test Places API
        function testPlacesAPI(map) {
            try {
                const service = new google.maps.places.PlacesService(map);

                const request = {
                    query: 'Arzt Wien',
                    fields: ['name', 'geometry']
                };

                service.textSearch(request, function(results, status) {
                    if (status === google.maps.places.PlacesServiceStatus.OK) {
                        placesStatusDiv.innerHTML = `<div class="status success">✅ Places API funktioniert! ${results.length} Ärzte in Wien gefunden.</div>`;
                    } else if (status === google.maps.places.PlacesServiceStatus.REQUEST_DENIED) {
                        placesStatusDiv.innerHTML = '<div class="status error">❌ Places API: Zugriff verweigert!<br>Bitte überprüfen Sie:<br>1. Ist die "Places API" aktiviert?<br>2. Ist der API Key für die Places API freigegeben?</div>';
                    } else {
                        placesStatusDiv.innerHTML = `<div class="status error">❌ Places API Fehler: ${status}</div>`;
                    }
                });
            } catch (error) {
                placesStatusDiv.innerHTML = `<div class="status error">❌ Fehler bei Places API: ${error.message}</div>`;
            }
        }

        // Check API Key format
        if (API_KEY && API_KEY.startsWith('AIza')) {
            statusDiv.innerHTML = '<div class="status info">⏳ Lade Google Maps API...</div>';
            loadGoogleMaps();
        } else {
            statusDiv.innerHTML = '<div class="status error">❌ API Key sieht nicht korrekt aus. Ein Google API Key sollte mit "AIza" beginnen.</div>';
        }
    </script>
</body>
</html>
